name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: priyanshuk6395
          outputs: dist/github-contribution-grid-snake-dark.svg

      - name: Move output
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake-dark.svg output/

      - name: Commit & Push Snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update snake animation"
          branch: main
          file_pattern: output/*
